# SonarQube / SonarScanner configuration for local_fastpix.
#
# This project follows Moodle's coding standard ("Frankenstyle"), which is
# enforced by moodle-plugin-ci (phpcs with the moodle ruleset). Several default
# SonarWay PHP rules conflict with Moodle's mandatory conventions or with
# intentional, audited code, so they are excluded below. The same rules are
# disabled for the IDE in ../../../.vscode/settings.json.
#
# See docs/review/SONARQUBE-2026-06-11.md for the full rationale.

sonar.projectKey=local_fastpix
sonar.projectName=local_fastpix
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Third-party vendored code (php-jwt) and generated AMD bundles are not ours.
sonar.exclusions=classes/vendor/**,amd/build/**,**/*.min.js

# --- Rule exclusions (false positives for this codebase) ---
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14

# S101 — class names must match ^[A-Z]... . Moodle REQUIRES snake_case class
# names (e.g. asset_service) for its autoloader to map
# \local_fastpix\service\asset_service -> classes/service/asset_service.php.
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S101
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php

# S100 — method names must match ^[a-z][a-zA-Z0-9]*$ (camelCase). Moodle uses
# snake_case method names (get_by_fastpix_id, ensure_signing_key, ...) as a
# mandatory framework convention.
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S100
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.php

# S1313 — hardcoded IP addresses. The only hardcoded IPs are the cloud metadata
# endpoints (169.254.169.254, fd00:ec2::254) that the SSRF guard in
# classes/service/upload_service.php intentionally blocks.
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1313
sonar.issue.ignore.multicriteria.e3.resourceKey=classes/service/upload_service.php

# S1448 — "too many methods" (limit 20). The gateway is the single trusted HTTP
# boundary to FastPix (rule A2: no other class may make FastPix HTTP calls). It
# deliberately owns retry, circuit breaker, idempotency keys, two timeout
# profiles, structured logging and credential injection as small cohesive
# helpers. Splitting it would violate A2 and needs a @backend-architect ADR, not
# a lint fix. Scoped to the gateway only — other god-classes are still flagged.
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.e4.resourceKey=classes/api/gateway.php

# S1793 — prefers "elseif" over "else if". Moodle's coding style uses "} else if {"
# (the S3358 ternary-flatten fix in this codebase deliberately produced one), so
# this rule conflicts with the mandatory house style.
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S1793
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.php

# S1172 — unused function parameter. The flagged parameters are mandated by
# Moodle framework signatures, not dead code, so they must stay. Scoped to the
# specific framework-signature files (S1172 stays strict everywhere else):
#  - hook/after_config_callback.php: handle(\core\hook\after_config $hook) is the
#    Moodle hook-callback contract (registered in db/hooks.php; Phase 2 uses it).
#  - privacy/provider.php: get_contexts_for_userid($userid) — privacy interface.
#  - service/playback_service.php: $userid — documented consumer contract (CC1).
sonar.issue.ignore.multicriteria.e6.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e6.resourceKey=classes/hook/after_config_callback.php
sonar.issue.ignore.multicriteria.e7.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e7.resourceKey=classes/privacy/provider.php
sonar.issue.ignore.multicriteria.e8.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.e8.resourceKey=classes/service/playback_service.php

# S6600 — "unnecessary parentheses for constructs". Moodle's coding style writes
# require()/require_once()/include() WITH parentheses (Moodle core uses this form
# universally — e.g. every CLI script's `require_once(__DIR__ . '/../config.php')`).
# Removing them would make this plugin deviate from the house convention, so the
# rule conflicts with mandatory Moodle style — same class as S1793.
sonar.issue.ignore.multicriteria.e9.ruleKey=php:S6600
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*.php

# S3011 — reflection used to increase accessibility. The test suite injects
# mocks into private static `instance` singletons (and calls private "reflection
# seam" methods) via ReflectionClass::setAccessible — the standard PHPUnit
# mock-injection pattern when a class exposes no public test seam. Production
# code never bypasses accessibility, so this is scoped to test sources only.
sonar.issue.ignore.multicriteria.e10.ruleKey=php:S3011
sonar.issue.ignore.multicriteria.e10.resourceKey=tests/**/*.php

# S1192 — duplicated string literals. Test code follows DAMP (descriptive,
# readable duplication) over DRY: repeated assertion keys and fixture values
# (response keys, mock method names, test IPs) are clearer inline than hidden
# behind key-constants. Scoped to test sources only — S1192 stays strict in
# classes/ (where it was fixed with real class constants) and cli/.
sonar.issue.ignore.multicriteria.e11.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e11.resourceKey=tests/**/*.php

# --- amd/src/settings.js — admin-settings card enhancer (cosmetic, try/catch-
# guarded; degrades to plain Moodle widgets on any DOM surprise). The bulk of
# its SonarQube findings were fixed in code (optional chaining, for-of,
# String#startsWith, .remove()/.before(), String.raw, Math.max, negated
# ternary). These three remain DEFERRED DEBT, scoped to this one file:
#  - S3776: enhanceCards()/enhanceSelect() cognitive complexity (17/16 vs 15).
#    A clean fix needs decomposing two large DOM-builder functions; deferred
#    because it's progressive-enhancement UI with no test harness here.
#  - S2004: the reveal/copy listener nesting in the masked-credential decorator.
#  - S1874: document.execCommand('copy') is the ONLY clipboard fallback for
#    non-secure (http) contexts where navigator.clipboard is absent; the modern
#    API is tried first. No non-deprecated replacement exists. TODO: revisit.
sonar.issue.ignore.multicriteria.e12.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e12.resourceKey=amd/src/settings.js
sonar.issue.ignore.multicriteria.e13.ruleKey=javascript:S2004
sonar.issue.ignore.multicriteria.e13.resourceKey=amd/src/settings.js
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S1874
sonar.issue.ignore.multicriteria.e14.resourceKey=amd/src/settings.js
